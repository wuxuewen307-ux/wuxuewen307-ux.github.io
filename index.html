<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover + safe-area-inset-* 让移动端刘海/圆角屏有安全边距 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Web Phone Launcher</title>
  <style>
    /* =========================================================
       基础变量
       说明：
       - 修改主题颜色：优先改下面的 CSS 变量
       - 修改壁纸：优先改 JS 中的 WALLPAPERS 数组
       ========================================================= */
    :root {
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --ease-out: cubic-bezier(.22, 1, .36, 1);
      --ease-spring: cubic-bezier(.175, .885, .32, 1.275);
      --phone-width: min(92vw, 420px);
      --phone-height: min(92vh, 860px);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --wallpaper: radial-gradient(circle at 20% 20%, rgba(255,255,255,.14), transparent 26%),
                   radial-gradient(circle at 78% 28%, rgba(255,255,255,.10), transparent 20%),
                   radial-gradient(circle at 52% 78%, rgba(255,255,255,.08), transparent 26%),
                   linear-gradient(145deg, #1f2758, #522796 42%, #0ba8c7 85%);
      --wallpaper-overlay: rgba(10, 12, 26, .12);
      --desktop-card: rgba(255, 255, 255, .16);
      --desktop-stroke: rgba(255, 255, 255, .24);
      --desktop-text: rgba(255, 255, 255, .95);
      --desktop-text-soft: rgba(255, 255, 255, .72);
      --body-bg: radial-gradient(circle at top, #12304f, #081221 55%, #03060c 100%);
      --body-grid: rgba(255, 255, 255, .04);
      --shadow-ambient: 0 30px 80px rgba(0, 0, 0, .55);
      --shadow-soft: 0 18px 36px rgba(0, 0, 0, .18);
      --shadow-lift: 0 18px 44px rgba(0, 0, 0, .26);
      --blur-strong: blur(26px) saturate(145%);
      --blur-soft: blur(18px) saturate(120%);
      --screen-radius: 34px;
      --frame-radius: 44px;
      --app-bg: rgba(246, 248, 252, .86);
      --app-stroke: rgba(22, 26, 38, .08);
      --app-text: #101827;
      --app-text-soft: #546074;
      --app-card: rgba(255,255,255,.72);
      --accent: #6b6cff;
      --accent-2: #ff5cc8;
      --success: #34c759;
      --danger: #ff4d6d;
      --warning: #ffb020;
      --shadow-inner: inset 0 1px 0 rgba(255,255,255,.45);
      --icon-size: 64px;
      --status-top-gap: calc(10px + var(--safe-top));
      --dock-bottom-gap: calc(14px + var(--safe-bottom));
    }

    body[data-theme="dark"] {
      --app-bg: rgba(13, 18, 29, .82);
      --app-stroke: rgba(255,255,255,.09);
      --app-text: #f4f7ff;
      --app-text-soft: #a8b3c8;
      --app-card: rgba(255,255,255,.08);
      --desktop-card: rgba(255, 255, 255, .12);
      --desktop-stroke: rgba(255, 255, 255, .18);
      --desktop-text: rgba(255, 255, 255, .96);
      --desktop-text-soft: rgba(255, 255, 255, .74);
      --body-bg: radial-gradient(circle at top, #12304f, #09111f 55%, #02050a 100%);
      --body-grid: rgba(255,255,255,.04);
    }

    body[data-theme="light"] {
      --body-bg: radial-gradient(circle at top, #d8ecff, #eff5ff 45%, #dbe5ff 100%);
      --body-grid: rgba(10,18,30,.05);
      --desktop-card: rgba(255,255,255,.28);
      --desktop-stroke: rgba(255,255,255,.52);
      --desktop-text: rgba(255,255,255,.96);
      --desktop-text-soft: rgba(255,255,255,.82);
      --wallpaper-overlay: rgba(255,255,255,.12);
      --app-bg: rgba(251, 252, 255, .82);
      --app-card: rgba(255,255,255,.9);
      --app-stroke: rgba(14, 19, 33, .08);
      --app-text: #111827;
      --app-text-soft: #566375;
      --shadow-ambient: 0 30px 80px rgba(22, 35, 58, .24);
      --shadow-soft: 0 18px 36px rgba(27, 52, 92, .12);
      --shadow-lift: 0 18px 44px rgba(27, 52, 92, .16);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: var(--font-ui);
      color: var(--app-text);
      background: var(--body-bg);
      overflow: hidden;
      display: grid;
      place-items: center;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background .45s var(--ease-out), color .25s ease;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -2;
    }

    body::before {
      background:
        radial-gradient(circle at 20% 20%, rgba(120, 186, 255, .28), transparent 22%),
        radial-gradient(circle at 82% 24%, rgba(255, 126, 208, .22), transparent 18%),
        radial-gradient(circle at 46% 82%, rgba(0, 225, 255, .18), transparent 24%);
      filter: blur(36px);
    }

    body::after {
      background-image:
        linear-gradient(var(--body-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--body-grid) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: linear-gradient(to bottom, rgba(255,255,255,.45), rgba(255,255,255,.12));
      z-index: -1;
    }

    button, input {
      font: inherit;
    }

    button {
      border: 0;
      background: none;
      cursor: pointer;
      color: inherit;
    }

    input {
      outline: none;
      border: 0;
      background: none;
      color: inherit;
    }

    .stage {
      width: min(100%, 1280px);
      padding: 18px;
      display: grid;
      place-items: center;
    }

    .phone-shell {
      position: relative;
      width: var(--phone-width);
      height: var(--phone-height);
      max-height: 860px;
      min-height: 690px;
      filter: drop-shadow(0 34px 60px rgba(0,0,0,.35));
    }

    .phone-frame {
      position: absolute;
      inset: 0;
      padding: 12px;
      border-radius: var(--frame-radius);
      background:
        linear-gradient(160deg, rgba(40,40,46,.94), rgba(10,10,14,.98) 30%, rgba(26,26,30,.98) 70%, rgba(7,7,11,1)),
        linear-gradient(180deg, rgba(255,255,255,.08), transparent 14%);
      box-shadow:
        var(--shadow-ambient),
        inset 0 1px 0 rgba(255,255,255,.12),
        inset 0 -2px 10px rgba(0,0,0,.45);
      overflow: hidden;
    }

    .side-button {
      position: absolute;
      right: -3px;
      width: 6px;
      border-radius: 999px;
      background: linear-gradient(180deg, #4d4d55, #1d1d23);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 2px 4px rgba(0,0,0,.45);
      z-index: 2;
    }

    .side-button.power { top: 180px; height: 92px; }
    .side-button.volume-up { left: -3px; top: 145px; height: 88px; }
    .side-button.volume-down { left: -3px; top: 248px; height: 88px; }

    .phone-screen {
      position: relative;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: var(--screen-radius);
      background: #05060b;
      transform: translateZ(0);
      isolation: isolate;
    }

    #wallpaperLayer {
      position: absolute;
      inset: 0;
      background: var(--wallpaper);
      transition: background .55s var(--ease-out);
    }

    #wallpaperLayer::before,
    #wallpaperLayer::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #wallpaperLayer::before {
      background:
        radial-gradient(circle at 14% 16%, rgba(255,255,255,.18), transparent 18%),
        radial-gradient(circle at 78% 22%, rgba(255,255,255,.10), transparent 16%),
        radial-gradient(circle at 60% 72%, rgba(255,255,255,.08), transparent 22%);
      opacity: .92;
      filter: blur(2px);
    }

    #wallpaperLayer::after {
      background: linear-gradient(180deg, rgba(0,0,0,.12), var(--wallpaper-overlay));
    }

    .phone-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
      pointer-events: none;
      z-index: 5;
    }

    .dynamic-island {
      position: absolute;
      top: calc(10px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      width: 118px;
      height: 34px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(10,10,12,.98), rgba(0,0,0,1));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 3px 10px rgba(0,0,0,.35);
      z-index: 30;
    }

    .os-root {
      position: absolute;
      inset: 0;
      z-index: 10;
    }

    .desktop-view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      transition: transform .45s var(--ease-out), opacity .3s ease, filter .35s ease;
    }

    .os-root.has-app .desktop-view {
      transform: scale(.965);
      opacity: .42;
      filter: blur(10px) saturate(.95);
      pointer-events: none;
    }

    .status-bar {
      position: relative;
      z-index: 3;
      height: 48px;
      margin-top: var(--status-top-gap);
      padding: 0 18px 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--desktop-text);
      text-shadow: 0 1px 10px rgba(0,0,0,.18);
    }

    .status-time {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .02em;
      min-width: 58px;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--desktop-text);
    }

    .status-icons svg {
      width: 18px;
      height: 18px;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .desktop-scroll {
      position: relative;
      flex: 1;
      overflow: auto;
      padding: 4px 16px calc(120px + var(--safe-bottom));
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .desktop-scroll::-webkit-scrollbar { display: none; }

    .hero-row {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 14px;
      margin-top: 8px;
    }

    .glass-card,
    .search-bar,
    .dock,
    .app-header,
    .app-nav,
    .app-card,
    .embed-shell,
    .browser-toolbar,
    .chip {
      background: var(--desktop-card);
      border: 1px solid var(--desktop-stroke);
      box-shadow: var(--shadow-soft), var(--shadow-inner);
      backdrop-filter: var(--blur-soft);
      -webkit-backdrop-filter: var(--blur-soft);
    }

    .glass-card {
      border-radius: 24px;
      padding: 18px;
      color: var(--desktop-text);
      overflow: hidden;
      position: relative;
    }

    .glass-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.16), transparent 36%);
      pointer-events: none;
      opacity: .9;
    }

    .widget-top {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 10px;
    }

    .widget-big-time {
      font-size: clamp(32px, 6vw, 44px);
      font-weight: 800;
      line-height: .95;
      letter-spacing: -.03em;
    }

    .widget-date {
      margin-top: 8px;
      font-size: 14px;
      color: var(--desktop-text-soft);
    }

    .widget-pill {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.24);
      background: rgba(255,255,255,.10);
      color: var(--desktop-text);
      font-size: 13px;
      white-space: nowrap;
    }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 18px;
      padding: 13px 16px;
      font-size: 14px;
      color: var(--desktop-text-soft);
      margin: 14px 0 4px;
    }

    .search-bar svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px 10px;
      padding: 14px 2px 0;
    }

    .app-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .app-icon .icon-badge {
      position: relative;
      width: var(--icon-size);
      height: var(--icon-size);
      border-radius: 20px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 28px;
      box-shadow: 0 14px 28px rgba(0,0,0,.26), inset 0 1px 1px rgba(255,255,255,.18);
      transition: transform .22s var(--ease-out), box-shadow .22s ease, filter .22s ease;
      overflow: hidden;
      isolation: isolate;
      background: linear-gradient(135deg, #64748b, #334155);
    }

    .app-icon .icon-badge::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.18), transparent 32%);
      z-index: -1;
    }

    .app-icon .icon-label {
      max-width: 84px;
      text-align: center;
      color: var(--desktop-text);
      font-size: 12px;
      font-weight: 600;
      text-shadow: 0 2px 10px rgba(0,0,0,.22);
      line-height: 1.2;
    }

    @media (hover:hover) {
      .app-icon:hover .icon-badge {
        transform: translateY(-4px) scale(1.04);
        box-shadow: 0 18px 36px rgba(0,0,0,.28), inset 0 1px 1px rgba(255,255,255,.22);
        filter: saturate(1.08);
      }
    }

    .app-icon:active .icon-badge {
      transform: scale(.94);
    }

    .dock {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: var(--dock-bottom-gap);
      z-index: 3;
      border-radius: 28px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .dock .app-icon .icon-label {
      display: none;
    }

    .dock .app-icon .icon-badge {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      font-size: 26px;
    }

    .app-layer {
      position: absolute;
      inset: 0;
      z-index: 40;
      pointer-events: none;
    }

    .app-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      border-radius: inherit;
      background: var(--app-bg);
      backdrop-filter: var(--blur-strong);
      -webkit-backdrop-filter: var(--blur-strong);
      border: 1px solid var(--app-stroke);
      color: var(--app-text);
      opacity: 0;
      transform: translateY(18px) scale(.985);
      pointer-events: none;
      overflow: hidden;
    }

    .app-screen.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
      transition: opacity .24s ease, transform .42s var(--ease-out);
    }

    .app-bg-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .9;
    }

    .app-bg-layer::before,
    .app-bg-layer::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      filter: blur(40px);
      opacity: .4;
    }

    .app-bg-layer::before {
      width: 180px;
      height: 180px;
      top: -30px;
      right: -20px;
      background: rgba(98, 106, 255, .26);
    }

    .app-bg-layer::after {
      width: 220px;
      height: 220px;
      bottom: -60px;
      left: -30px;
      background: rgba(255, 92, 200, .22);
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: calc(18px + var(--safe-top)) 16px 14px;
      background: rgba(255,255,255,.12);
      border: 0;
      border-bottom: 1px solid var(--app-stroke);
      box-shadow: none;
      backdrop-filter: var(--blur-soft);
      -webkit-backdrop-filter: var(--blur-soft);
    }

    .app-header-left,
    .app-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 92px;
    }

    .app-header-right {
      justify-content: flex-end;
    }

    .header-btn {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.58);
      color: var(--app-text);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72), 0 6px 14px rgba(0,0,0,.08);
      transition: transform .2s ease, background .2s ease;
    }

    body[data-theme="dark"] .header-btn {
      background: rgba(255,255,255,.10);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 6px 14px rgba(0,0,0,.18);
    }

    .header-btn:hover { transform: translateY(-1px); }
    .header-btn:active { transform: scale(.94); }

    .app-title-wrap {
      text-align: center;
      flex: 1;
      min-width: 0;
    }

    .app-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -.01em;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-subtitle {
      margin-top: 4px;
      font-size: 12px;
      color: var(--app-text-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-body {
      position: relative;
      z-index: 3;
      flex: 1;
      overflow: auto;
      padding: 18px 16px calc(92px + var(--safe-bottom));
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .app-body::-webkit-scrollbar { display: none; }

    .app-stack {
      display: grid;
      gap: 14px;
    }

    .hero-app-card,
    .app-card {
      position: relative;
      border-radius: 24px;
      padding: 18px;
      background: var(--app-card);
      border: 1px solid var(--app-stroke);
      box-shadow: var(--shadow-soft), var(--shadow-inner);
      overflow: hidden;
    }

    .hero-app-card h3,
    .app-card h3 {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.01em;
    }

    .hero-app-card p,
    .app-card p,
    .muted,
    .tiny-note {
      margin: 0;
      color: var(--app-text-soft);
      line-height: 1.65;
    }

    .tiny-note { font-size: 12px; }

    .hero-app-card .gradient-line {
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      margin-top: 14px;
    }

    .stats-row {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .stat-box {
      padding: 14px;
      border-radius: 18px;
      background: rgba(255,255,255,.10);
      border: 1px solid var(--app-stroke);
      text-align: center;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .embed-shell {
      position: relative;
      border-radius: 26px;
      overflow: hidden;
      min-height: 240px;
      background: rgba(8,12,24,.92);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 16px 40px rgba(0,0,0,.26);
    }

    .embed-shell.tall {
      min-height: 520px;
      aspect-ratio: 9 / 16;
    }

    .embed-shell iframe {
      width: 100%;
      height: 100%;
      min-height: inherit;
      display: block;
      border: 0;
      background: #020204;
    }

    .embed-skeleton {
      position: absolute;
      inset: 0;
      display: none;
      background:
        linear-gradient(90deg, rgba(255,255,255,.06), rgba(255,255,255,.16), rgba(255,255,255,.06)) 0 0 / 220% 100%,
        linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      animation: skeletonMove 1.35s linear infinite;
      pointer-events: none;
      z-index: 2;
    }

    .embed-shell.is-loading .embed-skeleton {
      display: block;
    }

    @keyframes skeletonMove {
      from { background-position: 100% 0, 0 0; }
      to { background-position: -100% 0, 0 0; }
    }

    .embed-fallback {
      position: absolute;
      inset: auto 14px 14px 14px;
      z-index: 3;
      display: none;
      padding: 14px;
      border-radius: 18px;
      background: rgba(6, 9, 18, .82);
      border: 1px solid rgba(255,255,255,.14);
      color: rgba(255,255,255,.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 12px 24px rgba(0,0,0,.28);
    }

    .embed-shell.show-fallback .embed-fallback {
      display: grid;
      gap: 8px;
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .cta,
    .ghost-btn,
    .chip,
    .segmented button,
    .setting-swatch,
    .track-item,
    .video-item,
    .bookmark-item,
    .reply-chip {
      border-radius: 16px;
      transition: transform .2s ease, opacity .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .cta,
    .ghost-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 14px;
      font-weight: 700;
    }

    .cta {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      box-shadow: 0 12px 24px rgba(71, 76, 232, .28);
    }

    .ghost-btn {
      background: rgba(255,255,255,.10);
      color: inherit;
      border: 1px solid var(--app-stroke);
    }

    .segmented {
      display: inline-flex;
      padding: 4px;
      border-radius: 18px;
      background: rgba(255,255,255,.12);
      border: 1px solid var(--app-stroke);
      gap: 4px;
      flex-wrap: wrap;
    }

    .segmented button {
      padding: 10px 14px;
      font-weight: 700;
      color: var(--app-text-soft);
      background: transparent;
    }

    .segmented button.is-active {
      background: rgba(255,255,255,.64);
      color: var(--app-text);
      box-shadow: 0 6px 16px rgba(0,0,0,.08);
    }

    body[data-theme="dark"] .segmented button.is-active {
      background: rgba(255,255,255,.14);
      box-shadow: 0 6px 16px rgba(0,0,0,.18);
    }

    .app-nav {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: calc(14px + var(--safe-bottom));
      z-index: 8;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      padding: 10px;
      border-radius: 24px;
      background: rgba(255,255,255,.16);
      border: 1px solid var(--app-stroke);
      backdrop-filter: var(--blur-soft);
      -webkit-backdrop-filter: var(--blur-soft);
    }

    .app-nav button {
      min-height: 50px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-weight: 700;
      background: rgba(255,255,255,.48);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.62), 0 8px 16px rgba(0,0,0,.08);
    }

    body[data-theme="dark"] .app-nav button {
      background: rgba(255,255,255,.10);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 8px 16px rgba(0,0,0,.18);
    }

    .app-nav small {
      display: block;
      font-size: 11px;
      line-height: 1.1;
      color: var(--app-text-soft);
      font-weight: 600;
      margin-top: 2px;
    }

    .douyin-stage {
      display: grid;
      gap: 16px;
    }

    .video-overlay-ui {
      position: absolute;
      inset: auto 0 0 0;
      padding: 18px;
      z-index: 2;
      display: grid;
      gap: 10px;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,.68));
      color: #fff;
      pointer-events: none;
    }

    .video-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 13px;
      color: rgba(255,255,255,.85);
    }

    .video-feed-card {
      min-height: 180px;
      border-radius: 24px;
      padding: 16px;
      color: white;
      display: flex;
      align-items: end;
      position: relative;
      overflow: hidden;
      box-shadow: 0 18px 34px rgba(0,0,0,.22);
    }

    .video-feed-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.15));
    }

    .video-feed-card > * { position: relative; z-index: 1; }

    .yt-layout {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 14px;
    }

    .yt-player-card {
      display: grid;
      gap: 12px;
    }

    .video-list {
      display: grid;
      gap: 10px;
    }

    .video-item {
      display: grid;
      grid-template-columns: 84px 1fr;
      gap: 12px;
      align-items: center;
      padding: 10px;
      border-radius: 18px;
      background: rgba(255,255,255,.08);
      border: 1px solid var(--app-stroke);
      width: 100%;
      text-align: left;
    }

    .video-item.is-active {
      border-color: rgba(107,108,255,.48);
      background: rgba(107,108,255,.12);
      box-shadow: 0 10px 24px rgba(107,108,255,.12);
    }

    .video-thumb {
      border-radius: 16px;
      aspect-ratio: 16 / 9;
      background:
        linear-gradient(140deg, rgba(255,255,255,.22), transparent 38%),
        linear-gradient(145deg, #ff4b5c, #ff8a00);
      display: grid;
      place-items: center;
      color: white;
      font-size: 28px;
      overflow: hidden;
    }

    .video-item h4,
    .track-item h4,
    .chat-info h4,
    .gallery-caption h4,
    .bookmark-item h4 {
      margin: 0 0 6px;
      font-size: 14px;
      font-weight: 800;
    }

    .video-item p,
    .track-item p,
    .chat-info p,
    .gallery-caption p,
    .bookmark-item p {
      margin: 0;
      font-size: 12px;
      color: var(--app-text-soft);
      line-height: 1.5;
    }

    .browser-layout,
    .settings-layout,
    .about-layout,
    .gallery-layout,
    .music-layout,
    .chat-layout {
      display: grid;
      gap: 14px;
    }

    .browser-toolbar {
      display: grid;
      gap: 12px;
      padding: 14px;
      border-radius: 24px;
      background: rgba(255,255,255,.16);
      border: 1px solid var(--app-stroke);
    }

    .browser-bar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .browser-input {
      min-height: 48px;
      border-radius: 16px;
      padding: 0 14px;
      background: rgba(255,255,255,.58);
      border: 1px solid var(--app-stroke);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.65);
    }

    body[data-theme="dark"] .browser-input {
      background: rgba(255,255,255,.10);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10);
    }

    .bookmark-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .bookmark-item {
      padding: 12px;
      text-align: left;
      background: rgba(255,255,255,.08);
      border: 1px solid var(--app-stroke);
    }

    .browser-frame {
      min-height: 420px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .gallery-tile {
      position: relative;
      aspect-ratio: 3 / 4;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--app-stroke);
      box-shadow: 0 14px 28px rgba(0,0,0,.16);
      color: white;
      display: flex;
      align-items: end;
      padding: 14px;
    }

    .gallery-tile::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.22));
    }

    .gallery-caption { position: relative; z-index: 1; }

    .gallery-viewer {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(6,10,18,.62);
      backdrop-filter: blur(14px);
      z-index: 200;
      padding: 20px;
    }

    .gallery-viewer.is-open { display: grid; }

    .viewer-card {
      width: min(92vw, 420px);
      border-radius: 28px;
      padding: 18px;
      background: var(--app-bg);
      border: 1px solid var(--app-stroke);
      box-shadow: var(--shadow-ambient);
      overflow: hidden;
    }

    .viewer-stage {
      aspect-ratio: 4 / 5;
      border-radius: 22px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: end;
      padding: 16px;
      color: white;
    }

    .viewer-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.24));
    }

    .viewer-stage > * { position: relative; z-index: 1; }

    .music-hero {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 14px;
      align-items: center;
    }

    .album-cover {
      aspect-ratio: 1;
      border-radius: 26px;
      box-shadow: 0 18px 36px rgba(0,0,0,.16);
      position: relative;
      overflow: hidden;
      display: grid;
      place-items: center;
      font-size: 42px;
      color: white;
    }

    .album-cover::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.14), transparent 38%);
    }

    .progress-shell {
      margin-top: 12px;
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      overflow: hidden;
      border: 1px solid var(--app-stroke);
    }

    .progress-fill {
      height: 100%;
      width: 46%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    .track-list {
      display: grid;
      gap: 10px;
    }

    .track-item {
      width: 100%;
      text-align: left;
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--app-stroke);
      background: rgba(255,255,255,.08);
    }

    .track-item.is-active {
      background: rgba(107,108,255,.12);
      border-color: rgba(107,108,255,.42);
    }

    .track-mini-cover {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 24px;
    }

    .chat-thread {
      display: grid;
      gap: 12px;
    }

    .chat-bubble {
      max-width: 86%;
      padding: 13px 14px;
      border-radius: 20px;
      line-height: 1.6;
      box-shadow: 0 12px 20px rgba(0,0,0,.08);
    }

    .chat-bubble.left {
      justify-self: start;
      border-bottom-left-radius: 8px;
      background: rgba(255,255,255,.65);
      border: 1px solid var(--app-stroke);
    }

    .chat-bubble.right {
      justify-self: end;
      border-bottom-right-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
    }

    body[data-theme="dark"] .chat-bubble.left {
      background: rgba(255,255,255,.10);
    }

    .reply-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .reply-chip,
    .chip {
      padding: 10px 12px;
      background: rgba(255,255,255,.10);
      border: 1px solid var(--app-stroke);
      color: inherit;
    }

    .settings-panel {
      display: grid;
      gap: 14px;
    }

    .setting-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 16px;
      border-radius: 20px;
      background: rgba(255,255,255,.08);
      border: 1px solid var(--app-stroke);
    }

    .setting-row h4 {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 800;
    }

    .toggle {
      width: 54px;
      height: 32px;
      border-radius: 999px;
      padding: 4px;
      background: rgba(120,130,150,.36);
      position: relative;
      border: 1px solid rgba(255,255,255,.12);
      transition: background .25s ease;
    }

    .toggle::after {
      content: "";
      width: 22px;
      height: 22px;
      border-radius: 50%;
      position: absolute;
      top: 4px;
      left: 4px;
      background: white;
      box-shadow: 0 6px 12px rgba(0,0,0,.18);
      transition: transform .25s var(--ease-out);
    }

    .toggle.is-on {
      background: linear-gradient(135deg, var(--success), #66dd8a);
    }

    .toggle.is-on::after {
      transform: translateX(22px);
    }

    .swatch-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .setting-swatch {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      border: 2px solid transparent;
      box-shadow: 0 12px 24px rgba(0,0,0,.12);
    }

    .setting-swatch.is-active {
      border-color: white;
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .about-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .tech-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .tech-tags span {
      display: inline-flex;
      align-items: center;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.10);
      border: 1px solid var(--app-stroke);
      font-size: 12px;
      font-weight: 700;
    }

    .launch-ghost {
      position: fixed;
      z-index: 999;
      border-radius: 24px;
      pointer-events: none;
      box-shadow: 0 24px 48px rgba(0,0,0,.28);
      overflow: hidden;
      isolation: isolate;
    }

    .launch-ghost::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.18), transparent 34%);
    }

    .launch-ghost .ghost-inner {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: white;
      font-size: 42px;
      font-weight: 700;
    }

    .app-screen.app-youtube .app-bg-layer::before { background: rgba(255, 60, 95, .20); }
    .app-screen.app-youtube .app-bg-layer::after { background: rgba(255, 149, 0, .16); }
    .app-screen.app-douyin { background: rgba(5, 8, 15, .90); color: rgba(255,255,255,.96); }
    .app-screen.app-douyin .app-header,
    .app-screen.app-douyin .app-nav,
    .app-screen.app-douyin .hero-app-card,
    .app-screen.app-douyin .app-card {
      color: rgba(255,255,255,.96);
      --app-text-soft: rgba(255,255,255,.72);
      --app-stroke: rgba(255,255,255,.10);
      background-color: rgba(255,255,255,.07);
    }
    .app-screen.app-douyin .header-btn,
    .app-screen.app-douyin .app-nav button,
    .app-screen.app-douyin .ghost-btn,
    .app-screen.app-douyin .reply-chip,
    .app-screen.app-douyin .chip {
      background: rgba(255,255,255,.10);
      color: rgba(255,255,255,.96);
      border-color: rgba(255,255,255,.12);
    }
    .app-screen.app-browser .app-bg-layer::before { background: rgba(74, 222, 128, .14); }
    .app-screen.app-browser .app-bg-layer::after { background: rgba(59, 130, 246, .18); }
    .app-screen.app-gallery .app-bg-layer::before { background: rgba(255, 180, 0, .16); }
    .app-screen.app-gallery .app-bg-layer::after { background: rgba(236, 72, 153, .16); }
    .app-screen.app-music .app-bg-layer::before { background: rgba(99, 102, 241, .18); }
    .app-screen.app-music .app-bg-layer::after { background: rgba(16, 185, 129, .16); }
    .app-screen.app-chat .app-bg-layer::before { background: rgba(52, 199, 89, .18); }
    .app-screen.app-chat .app-bg-layer::after { background: rgba(59, 130, 246, .16); }
    .app-screen.app-settings .app-bg-layer::before { background: rgba(107, 114, 128, .14); }
    .app-screen.app-settings .app-bg-layer::after { background: rgba(217, 70, 239, .10); }
    .app-screen.app-about .app-bg-layer::before { background: rgba(14, 165, 233, .16); }
    .app-screen.app-about .app-bg-layer::after { background: rgba(244, 114, 182, .14); }

    @media (max-width: 900px) {
      .yt-layout { grid-template-columns: 1fr; }
      .about-grid { grid-template-columns: 1fr; }
      .bookmark-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 860px) {
      .stage {
        width: 100%;
        height: 100%;
        padding: 0;
      }

      .phone-shell {
        width: 100vw;
        height: 100dvh;
        min-height: 0;
        max-height: none;
      }

      .phone-frame {
        padding: 0;
        border-radius: 0;
        background: #000;
        box-shadow: none;
      }

      .phone-screen,
      .app-screen {
        border-radius: 0;
      }

      .dynamic-island {
        top: calc(8px + var(--safe-top));
      }

      .side-button { display: none; }
    }

    @media (max-width: 520px) {
      .bookmark-grid { grid-template-columns: 1fr; }
      .music-hero { grid-template-columns: 88px 1fr; }
      .app-grid { gap: 16px 8px; }
      .app-icon .icon-badge { width: 60px; height: 60px; }
      .gallery-grid { gap: 10px; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone-shell">
      <div class="side-button power"></div>
      <div class="side-button volume-up"></div>
      <div class="side-button volume-down"></div>
      <div class="phone-frame">
        <div class="phone-screen" id="phoneScreen">
          <div id="wallpaperLayer"></div>
          <div class="dynamic-island"></div>
          <div class="os-root" id="osRoot">
            <section class="desktop-view" id="desktopView">
              <div class="status-bar">
                <div class="status-time" id="statusTime">09:41</div>
                <div class="status-icons">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 18h2" />
                    <path d="M8 15h2" />

                  <svg viewBox="0 0 24 24" aria-hidden="true">

                    <path d="M6 12c3.8-3.8 8.2-3.8 12 0" />
                    <path d="M9.5 15.4c1.8-1.8 3.2-1.8 5 0" />
                    <path d="M12 18h.01" />

                  <svg viewBox="0 0 28 16" aria-hidden="true">
                    <rect x="1" y="1" width="22" height="14" rx="4" />
                    <path d="M25 5v6" />
                    <rect x="3.5" y="3.5" width="15.5" height="9" rx="2.5" fill="currentColor" stroke="none" />
                  </svg>
                </div>
              </div>
              <div class="desktop-scroll">
                <div class="hero-row">
                  <div class="glass-card">
                    <div class="widget-top">
                      <div>
                        <div class="widget-big-time" id="desktopBigTime">09:41</div>
                        <div class="widget-date" id="desktopDate">星期一 · 6 月 8 日</div>
                      </div>
                      <div class="widget-pill">Web Phone Launcher</div>
                    </div>

                  <div class="search-bar" aria-hidden="true">

      </div>

  </div>

  <div class="gallery-viewer" id="galleryViewer" aria-hidden="true"></div>

  <script>
    /* =========================================================
       Web Phone Launcher
       单文件版 / 数据驱动版
       你后续最常修改的位置：
       1. APP_CONFIG            -> 修改 App 图标顺序 / 是否放入 Dock / 标题 / 副标题
       2. YOUTUBE_VIDEOS        -> 修改 YouTube 视频 ID
       3. DOUYIN_CONFIG         -> 修改抖音 video_id / iframe src / 打开原页面链接
       4. WALLPAPERS            -> 修改壁纸颜色
       5. AUTHOR_INFO / VERSION -> 修改关于页信息
       ========================================================= */

    /* =========================
       App 配置区
       - 修改图标位置：直接调整 APP_CONFIG 数组顺序
       - 放入底部 Dock：把 dock 改为 true
       ========================= */
    const APP_CONFIG = [
      {
        id: "douyin",
        title: "抖音",
        subtitle: "短视频信息流",
        icon: "♪",
        dock: false,
        gradient: "linear-gradient(135deg, #111827 0%, #fe2c55 42%, #25f4ee 100%)",
        accent: "#fe2c55"
      },
      {
        id: "youtube",
        title: "YouTube",
        subtitle: "视频列表 + 播放器",
        icon: "▶",
        dock: false,
        gradient: "linear-gradient(135deg, #ff4d4f 0%, #ff2d55 52%, #ff7a18 100%)",
        accent: "#ff4d4f"
      },
      {
        id: "gallery",
        title: "相册",
        subtitle: "照片与回忆",
        icon: "✦",
        dock: false,
        gradient: "linear-gradient(135deg, #ffb703 0%, #fb8500 48%, #ff5e7a 100%)",
        accent: "#ff9f1c"
      },
      {
        id: "about",
        title: "关于",
        subtitle: "项目介绍",
        icon: "◎",
        dock: false,
        gradient: "linear-gradient(135deg, #0ea5e9 0%, #6366f1 46%, #ec4899 100%)",
        accent: "#0ea5e9"
      },
      {
        id: "browser",
        title: "浏览器",
        subtitle: "内嵌网页",
        icon: "⌘",
        dock: true,
        gradient: "linear-gradient(135deg, #22c55e 0%, #06b6d4 56%, #3b82f6 100%)",
        accent: "#22c55e"
      },
      {
        id: "music",
        title: "音乐",
        subtitle: "播放列表",
        icon: "♫",
        dock: true,
        gradient: "linear-gradient(135deg, #8b5cf6 0%, #6366f1 52%, #14b8a6 100%)",
        accent: "#8b5cf6"
      },
      {
        id: "chat",
        title: "聊天",
        subtitle: "消息对话",
        icon: "✉",
        dock: true,
        gradient: "linear-gradient(135deg, #22c55e 0%, #10b981 48%, #34d399 100%)",
        accent: "#34c759"
      },
      {
        id: "settings",
        title: "设置",
        subtitle: "主题与壁纸",
        icon: "⚙",
        dock: true,
        gradient: "linear-gradient(135deg, #64748b 0%, #475569 48%, #0f172a 100%)",
        accent: "#64748b"
      }
    ];

    /* =========================
       YouTube 视频配置区
       - 直接替换 id 即可

       ========================= */
    const memoryStore = {};
    const STORAGE_KEY = "web-phone-launcher-state-v1";

    function persistState() {
      const snapshot = {
        themeMode: state.themeMode,
        wallpaperId: state.wallpaperId,
        animations: state.animations,
        currentYoutubeId: state.currentYoutubeId,
        currentTrackId: state.currentTrackId,
        currentBrowserUrl: state.currentBrowserUrl,
        chatMessages: state.chatMessages
      };
      memoryStore[STORAGE_KEY] = snapshot;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
      } catch (error) {
        /* 某些 file:// 场景下会抛 SecurityError，这里静默降级 */
      }
    }

    function restoreState() {
      let raw = null;
      try {
        raw = localStorage.getItem(STORAGE_KEY);
      } catch (error) {
        raw = null;
      }
      let parsed = null;
      if (raw) {
        try {
          parsed = JSON.parse(raw);
        } catch (error) {
          parsed = null;
        }
      } else if (memoryStore[STORAGE_KEY]) {
        parsed = memoryStore[STORAGE_KEY];
      }
      if (!parsed) return;
      state.themeMode = parsed.themeMode || state.themeMode;
      state.wallpaperId = parsed.wallpaperId || state.wallpaperId;
      state.animations = typeof parsed.animations === "boolean" ? parsed.animations : state.animations;
      state.currentYoutubeId = parsed.currentYoutubeId || state.currentYoutubeId;
      state.currentTrackId = parsed.currentTrackId || state.currentTrackId;
      state.currentBrowserUrl = parsed.currentBrowserUrl || state.currentBrowserUrl;
      state.chatMessages = Array.isArray(parsed.chatMessages) && parsed.chatMessages.length ? parsed.chatMessages : [...INITIAL_CHAT];
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function getWallpaperById(id) {
      return WALLPAPERS.find(w => w.id === id) || WALLPAPERS[0];
    }

    function getTrackById(id) {
      return MUSIC_TRACKS.find(track => track.id === id) || MUSIC_TRACKS[0];
    }

    function getYoutubeById(id) {
      return YOUTUBE_VIDEOS.find(video => video.id === id) || YOUTUBE_VIDEOS[0];
    }

    function normalizeUrl(rawUrl) {
      const text = String(rawUrl || "").trim();
      if (!text) return "about:blank";
      if (/^https?:\/\//i.test(text) || /^about:/i.test(text)) return text;
      return `https://${text}`;
    }

    function formatClockParts(date = new Date()) {
      const time = new Intl.DateTimeFormat("zh-CN", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(date);

      const dateLabel = new Intl.DateTimeFormat("zh-CN", {
        weekday: "long",
        month: "long",
        day: "numeric"
      }).format(date);

      return { time, dateLabel };
    }

    function getSystemTheme() {
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    function applyTheme() {
      state.actualTheme = state.themeMode === "system" ? getSystemTheme() : state.themeMode;
      elements.body.dataset.theme = state.actualTheme;
    }

    function applyWallpaper() {
      const wallpaper = getWallpaperById(state.wallpaperId);
      elements.wallpaperLayer.style.background = wallpaper.css;
    }

    function updateClock() {
      const { time, dateLabel } = formatClockParts(new Date());
      elements.statusTime.textContent = time;
      elements.desktopBigTime.textContent = time;
      elements.desktopDate.textContent = dateLabel;
    }

    function buildYoutubeEmbedUrl(videoId, options = {}) {
      const params = new URLSearchParams({
        autoplay: options.autoplay ? "1" : "0",
        rel: "0",
        modestbranding: "1",
        playsinline: "1"
      });
      return `https://www.youtube-nocookie.com/embed/${videoId}?${params.toString()}`;
    }

    function buildDouyinIframeUrl(videoId) {
      return DOUYIN_CONFIG.iframeSrcTemplate.replace("{id}", encodeURIComponent(videoId));
    }

        </div>
      `);
    }

    function renderChatApp() {
      return renderAppShell(APP_MAP.get("chat"), `
        <div class="chat-layout">
          <section class="hero-app-card">
            <h3>聊天</h3>
            <p>这是一个前端消息页面示例。点击下面的快捷回复，会在当前页面里即时追加一条消息。</p>
            <div class="gradient-line"></div>
          </section>
          <section class="chat-thread" id="chatThread">
            ${state.chatMessages.map(message => `
              <div class="chat-bubble ${message.side}">${escapeHtml(message.text)}</div>
            `).join("")}

            <h3>快捷回复</h3>
            <div class="reply-row">

    function renderSettingsApp() {
      return renderAppShell(APP_MAP.get("settings"), `

            <div class="gradient-line"></div>
          </section>

          <div class="settings-panel">
            <article class="setting-row">

                <h4>主题模式</h4>
                <p class="muted">跟随系统 / 浅色 / 深色</p>

              <div class="segmented" id="themeSegment">
                <button data-action="theme-switch" data-theme-mode="system" class="${state.themeMode === "system" ? "is-active" : ""}">系统</button>
                <button data-action="theme-switch" data-theme-mode="light" class="${state.themeMode === "light" ? "is-active" : ""}">浅色</button>
                <button data-action="theme-switch" data-theme-mode="dark" class="${state.themeMode === "dark" ? "is-active" : ""}">深色</button>
              </div>
            </article>

            <article class="setting-row">
              <div>
                <h4>开场 / 关闭动画</h4>
                <p class="muted">关闭后将直接切页，不再做从图标放大的动画。</p>
              </div>
              <button class="toggle ${state.animations ? "is-on" : ""}" data-action="toggle-animations" aria-label="切换动画"></button>
            </article>

            <article class="app-card">
              <h3>壁纸颜色</h3>
              <p class="muted">修改 WALLPAPERS 数组即可增加更多壁纸方案。</p>
              <div class="swatch-row" style="margin-top:12px;">
                ${WALLPAPERS.map(wallpaper => `
                  <button
                    class="setting-swatch ${wallpaper.id === state.wallpaperId ? "is-active" : ""}"
                    style="background:${wallpaper.css}"
                    data-action="wallpaper-switch"
                    data-wallpaper-id="${escapeHtml(wallpaper.id)}"
                    title="${escapeHtml(wallpaper.name)}"

              </div>
            </article>

            <article class="setting-row">
              <div>

                <p class="muted">Web Phone Launcher · ${escapeHtml(VERSION)}</p>

    function renderAboutApp() {
      return renderAppShell(APP_MAP.get("about"), `
        <div class="about-layout">
          <section class="hero-app-card">
            <h3>关于 Web Phone Launcher</h3>
            <p>这是一个纯前端、单文件、可直接运行的“手机桌面模拟器 / Web Phone Launcher”。它模拟了手机桌面、App 打开关闭、底部 Dock、状态栏与内嵌媒体页面。</p>
            <div class="stats-row">

              <div class="stat-box"><div class="stat-value">1</div><div class="tiny-note">单文件</div></div>
              <div class="stat-box"><div class="stat-value">0</div><div class="tiny-note">后端依赖</div></div>
            </div>
          </section>

          <section class="about-grid">
            <article class="app-card">
              <h3>作者占位</h3>
              <p>${escapeHtml(AUTHOR_INFO.author)}</p>
              <p class="muted">${escapeHtml(AUTHOR_INFO.role)}</p>

                <span>CSS</span>

          <article class="app-card">
            <h3>你可以继续扩展的内容</h3>
            <p>后续可以继续增加真实壁纸上传、更多 App、应用内 Tab、通知中心、锁屏页、拖拽图标、PWA 安装提示，以及本地音乐/图片数据导入。</p>
          </article>

    }

    function renderAppContent(appId) {
      switch (appId) {
        case "douyin": return renderDouyinApp();
        case "youtube": return renderYoutubeApp();
        case "browser": return renderBrowserApp();
        case "gallery": return renderGalleryApp();
        case "music": return renderMusicApp();
        case "chat": return renderChatApp();
        case "settings": return renderSettingsApp();
        case "about": return renderAboutApp();
        default:
          return renderAppShell({ title: "未知 App", subtitle: "未找到页面定义", id: "unknown" }, `
            <section class="app-card"><h3>未找到 App</h3><p>请检查 APP_CONFIG 和 renderAppContent 的 app.id 是否一致。</p></section>
          `);
      }
    }

    /* =========================
       打开 / 关闭 App 动画
       - 打开：从图标位置放大到整块屏幕
       - 关闭：从屏幕缩回到图标位置
       ========================= */
    function animateLaunch(fromButton, app) {
      if (!fromButton || !state.animations || !fromButton.isConnected) return Promise.resolve();
      const badge = fromButton.querySelector(".icon-badge");
      const startRect = badge.getBoundingClientRect();
      const endRect = elements.phoneScreen.getBoundingClientRect();
      const ghost = document.createElement("div");
      ghost.className = "launch-ghost";
      ghost.style.left = `${endRect.left}px`;
      ghost.style.top = `${endRect.top}px`;
      ghost.style.width = `${endRect.width}px`;
      ghost.style.height = `${endRect.height}px`;
      ghost.style.background = app.gradient;
      ghost.innerHTML = `<div class="ghost-inner">${escapeHtml(app.icon)}</div>`;
      document.body.appendChild(ghost);

      const startCx = startRect.left + startRect.width / 2;
      const startCy = startRect.top + startRect.height / 2;
      const endCx = endRect.left + endRect.width / 2;
      const endCy = endRect.top + endRect.height / 2;
      const dx = startCx - endCx;
      const dy = startCy - endCy;
      const scaleX = startRect.width / endRect.width;
      const scaleY = startRect.height / endRect.height;

      const animation = ghost.animate([
        {
          transform: `translate(${dx}px, ${dy}px) scale(${scaleX}, ${scaleY})`,
          borderRadius: "24px",
          opacity: 1
        },
        {
          transform: "translate(0px, 0px) scale(1, 1)",
          borderRadius: getComputedStyle(elements.phoneScreen).borderRadius,
          opacity: .08,
          offset: .72
        },
        {
          transform: "translate(0px, 0px) scale(1, 1)",
          borderRadius: getComputedStyle(elements.phoneScreen).borderRadius,
          opacity: 0
        }
      ], {
        duration: 540,
        easing: "cubic-bezier(.2, .9, .2, 1)",
        fill: "forwards"
      });

      return animation.finished.catch(() => undefined).finally(() => ghost.remove());
    }

    function animateClose(toButton, app) {
      if (!toButton || !state.animations || !toButton.isConnected) return Promise.resolve();
      const badge = toButton.querySelector(".icon-badge");
      const endRect = badge.getBoundingClientRect();
      const startRect = elements.phoneScreen.getBoundingClientRect();
      const ghost = document.createElement("div");
      ghost.className = "launch-ghost";
      ghost.style.left = `${startRect.left}px`;
      ghost.style.top = `${startRect.top}px`;
      ghost.style.width = `${startRect.width}px`;
      ghost.style.height = `${startRect.height}px`;
      ghost.style.background = app.gradient;
      ghost.innerHTML = `<div class="ghost-inner">${escapeHtml(app.icon)}</div>`;
      document.body.appendChild(ghost);

      const startCx = startRect.left + startRect.width / 2;
      const startCy = startRect.top + startRect.height / 2;
      const endCx = endRect.left + endRect.width / 2;
      const endCy = endRect.top + endRect.height / 2;
      const dx = endCx - startCx;
      const dy = endCy - startCy;
      const scaleX = endRect.width / startRect.width;
      const scaleY = endRect.height / startRect.height;

      const animation = ghost.animate([
        {
          transform: "translate(0px, 0px) scale(1, 1)",
          borderRadius: getComputedStyle(elements.phoneScreen).borderRadius,
          opacity: .18
        },
        {
          transform: `translate(${dx}px, ${dy}px) scale(${scaleX}, ${scaleY})`,
          borderRadius: "24px",
          opacity: .96
        }
      ], {
        duration: 420,
        easing: "cubic-bezier(.4, 0, .2, 1)",
        fill: "forwards"
      });

      return animation.finished.catch(() => undefined).finally(() => ghost.remove());
    }

    function mountApp(appId, fromButton) {
      const app = APP_MAP.get(appId);
      if (!app) return;
      state.activeAppId = appId;
      state.lastLaunchSource = appId;
      elements.appLayer.innerHTML = renderAppContent(appId);
      const screen = elements.appLayer.querySelector(".app-screen");
      hydrateCurrentApp();
      elements.osRoot.classList.add("has-app");
      requestAnimationFrame(() => {
        screen.classList.add("active");
      });
      animateLaunch(fromButton, app);
      persistState();
    }

    async function closeActiveApp() {
      if (!state.activeAppId) return;
      const app = APP_MAP.get(state.activeAppId);
      const screen = elements.appLayer.querySelector(".app-screen");
      const targetButton = document.querySelector(`.app-icon[data-app-id="${CSS.escape(state.activeAppId)}"]`);

      if (screen) {
        screen.classList.remove("active");
      }

      elements.osRoot.classList.remove("has-app");
      await Promise.all([
        state.animations ? animateClose(targetButton, app) : Promise.resolve(),
        new Promise(resolve => setTimeout(resolve, state.animations ? 260 : 0))
      ]);

      state.activeAppId = null;
      elements.appLayer.innerHTML = "";
      persistState();
    }

    function openAppByButton(button) {
      const appId = button?.dataset?.appId;
      if (!appId) return;
      if (state.activeAppId === appId) return;
      mountApp(appId, button);
    }

    /* =========================
       iframe 骨架屏 + fallback 逻辑
       - 如果 iframe 及时 load -> 隐藏骨架
       - 如果超时未加载 -> 显示 fallback 按钮
       - 不尝试绕过平台或网站的安全限制
       ========================= */
    function wireEmbedRoot(root) {
      const iframe = root.querySelector("[data-embed-iframe]");
      if (!iframe) return;
      const timeout = Number(root.dataset.timeout || 4200);
      let finished = false;

      const complete = () => {
        if (finished) return;
        finished = true;
        root.classList.remove("is-loading");
        root.classList.remove("show-fallback");
      };

      const fail = () => {
        if (finished) return;
        finished = true;
        root.classList.remove("is-loading");
        root.classList.add("show-fallback");
      };

      const timer = window.setTimeout(fail, timeout);

      iframe.addEventListener("load", () => {
        window.clearTimeout(timer);
        complete();
      }, { once: true });

      iframe.addEventListener("error", () => {
        window.clearTimeout(timer);
        fail();
      }, { once: true });
    }

    function hydrateCurrentApp() {
      const screen = elements.appLayer.querySelector(".app-screen");
      if (!screen) return;
      screen.querySelectorAll("[data-embed-root]").forEach(wireEmbedRoot);
    }

    /* =========================
       相册预览
       ========================= */
    function openGalleryViewer(itemId) {
      const item = GALLERY_ITEMS.find(entry => entry.id === itemId);
      if (!item) return;
      elements.galleryViewer.innerHTML = `
        <div class="viewer-card">
          <div class="viewer-stage" style="background:${item.gradient}">
            <div>
              <h3 style="margin:0 0 6px; font-size:22px;">${escapeHtml(item.title)}</h3>
              <p style="margin:0; color:rgba(255,255,255,.84);">${escapeHtml(item.desc)}</p>
            </div>
          </div>
          <div class="cta-row">
            <button class="cta" data-action="viewer-close">关闭预览</button>
          </div>
        </div>
      `;
      elements.galleryViewer.classList.add("is-open");
      elements.galleryViewer.setAttribute("aria-hidden", "false");
    }

    function closeGalleryViewer() {
      elements.galleryViewer.classList.remove("is-open");
      elements.galleryViewer.setAttribute("aria-hidden", "true");
      elements.galleryViewer.innerHTML = "";
    }

    /* =========================
       交互事件
       ========================= */
    function handleGlobalClick(event) {
      const appButton = event.target.closest(".app-icon[data-app-id]");
      if (appButton && !elements.appLayer.contains(appButton)) {
        openAppByButton(appButton);
        return;
      }

      const actionButton = event.target.closest("[data-action]");
      if (!actionButton) return;
      const action = actionButton.dataset.action;

      switch (action) {
        case "back":
        case "home":
        case "close":
          closeActiveApp();
          break;

        case "open-external": {
          const url = actionButton.dataset.url;
          if (url) window.open(url, "_blank", "noopener,noreferrer");
          break;
        }

        case "youtube-select": {
          state.currentYoutubeId = actionButton.dataset.videoId || YOUTUBE_VIDEOS[0].id;
          persistState();
          remountActiveApp();
          break;
        }

        case "browser-preset": {
          state.currentBrowserUrl = normalizeUrl(actionButton.dataset.url);
          persistState();
          remountActiveApp();
          break;
        }

        case "browser-go": {
          const input = document.getElementById("browserUrlInput");
          state.currentBrowserUrl = normalizeUrl(input ? input.value : state.currentBrowserUrl);
          persistState();
          remountActiveApp();
          break;
        }

        case "gallery-open":
          openGalleryViewer(actionButton.dataset.galleryId);
          break;

        case "viewer-close":
          closeGalleryViewer();
          break;

        case "music-select": {
          state.currentTrackId = actionButton.dataset.trackId || MUSIC_TRACKS[0].id;
          persistState();
          remountActiveApp();
          break;
        }

        case "chat-reply": {
          const text = actionButton.dataset.text || "好";
          state.chatMessages.push({ side: "right", text });
          if (text.includes("深色")) {
            state.themeMode = "dark";
            applyTheme();
          }
          if (text.includes("壁纸")) {
            const next = WALLPAPERS[(WALLPAPERS.findIndex(w => w.id === state.wallpaperId) + 1) % WALLPAPERS.length];
            state.wallpaperId = next.id;
            applyWallpaper();
          }
          persistState();
          remountActiveApp();
          requestAnimationFrame(() => {
            const thread = document.getElementById("chatThread");
            if (thread) thread.lastElementChild?.scrollIntoView({ behavior: "smooth", block: "end" });
          });
          break;
        }

        case "theme-switch": {
          state.themeMode = actionButton.dataset.themeMode || "system";
          applyTheme();
          persistState();
          remountActiveApp();
          break;
        }

        case "toggle-animations":
          state.animations = !state.animations;
          persistState();
          remountActiveApp();
          break;

        case "wallpaper-switch":
          state.wallpaperId = actionButton.dataset.wallpaperId || WALLPAPERS[0].id;
          applyWallpaper();
          persistState();
          remountActiveApp();
          break;

        case "copy-douyin": {
          const value = buildDouyinIframeUrl(DOUYIN_CONFIG.videoId);
          navigator.clipboard?.writeText(value).catch(() => undefined);
          actionButton.textContent = "已复制";
          setTimeout(() => { actionButton.textContent = "复制 iframe 地址"; }, 1200);
          break;
        }
      }
    }

    function handleKeydown(event) {
      if (event.key === "Escape" && elements.galleryViewer.classList.contains("is-open")) {
        closeGalleryViewer();
        return;
      }
      if (event.key === "Escape" && state.activeAppId) {
        closeActiveApp();
      }
      if (event.key === "Enter" && document.activeElement?.id === "browserUrlInput") {
        state.currentBrowserUrl = normalizeUrl(document.activeElement.value);
        persistState();
        remountActiveApp();
      }
    }

    function remountActiveApp() {
      if (!state.activeAppId) return;
      const currentApp = state.activeAppId;
      elements.appLayer.innerHTML = renderAppContent(currentApp);
      const screen = elements.appLayer.querySelector(".app-screen");
      hydrateCurrentApp();
      requestAnimationFrame(() => screen?.classList.add("active"));
    }

    function bindEvents() {
      document.addEventListener("click", handleGlobalClick);
      document.addEventListener("keydown", handleKeydown);
      elements.galleryViewer.addEventListener("click", (event) => {
        if (event.target === elements.galleryViewer || event.target.closest("[data-action='viewer-close']")) {
          closeGalleryViewer();
        }
      });

      if (window.matchMedia) {
        const mq = window.matchMedia("(prefers-color-scheme: dark)");
        const listener = () => {
          if (state.themeMode === "system") applyTheme();
        };
        if (typeof mq.addEventListener === "function") {
          mq.addEventListener("change", listener);
        } else if (typeof mq.addListener === "function") {
          mq.addListener(listener);
        }
      }
    }

    function init() {
      restoreState();
      renderLauncher();
      applyTheme();
      applyWallpaper();
      updateClock();
      bindEvents();
      window.setInterval(updateClock, 1000 * 30);
    }

    init();
  </script>
